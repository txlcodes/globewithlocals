databases:
  - name: gwl-db
    plan: basic-256mb
    region: frankfurt
    databaseName: gwl
    user: gwl

services:
  - type: web
    name: globewithlocals
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: cd api && npm install && npx prisma generate && npx prisma migrate deploy && cd ../web && npm install && npm run build
    startCommand: cd web && npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: gwl-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://globewithlocals.com
      - key: NEXT_PUBLIC_FRONTEND_URL
        value: https://globewithlocals.com
      - key: NEXT_PUBLIC_API_URL
        value: https://globewithlocals.com
      - key: SITEMAP_CITIES
        value: ""
      - key: R2_BUCKET
        value: globewithlocals-images
      - key: R2_PUBLIC_HOST
        value: https://images.globewithlocals.com
      - key: NEXT_PUBLIC_IMAGE_HOST
        value: https://images.globewithlocals.com
      - key: NTFY_URL
        value: https://ntfy.sh
      - key: ADMIN_EMAIL
        value: info@globewithlocals.com
      - key: ADMIN_ALERT_EMAIL
        value: info@globewithlocals.com
      # Secrets: set in the Render dashboard, never commit values.
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: CRON_SECRET
        generateValue: true
